<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account · MoneyShi</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D7852">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/app.css">
</head>
<body data-page="account">
<main class="wrap narrow">
  <div class="card panel">
    <h2 id="ac-h">Account</h2><p class="note" id="ac-u" style="margin:0 0 6px"></p>
    <label>Display name<input id="ac-disp" autocomplete="off"></label>
    <div class="btnrow"><button class="btn" id="ac-save" type="button">Save name</button></div>
    <p class="err" id="ac-err" role="status"></p>
  </div>
  <div class="card panel">
    <h3>Change password</h3>
    <label>Current password<input id="ac-cur" type="password" autocomplete="current-password"></label>
    <label>New password<input id="ac-new" type="password" autocomplete="new-password"></label>
    <label>Repeat new password<input id="ac-new2" type="password" autocomplete="new-password"></label>
    <div class="btnrow"><button class="btn" id="ac-pw" type="button">Change password</button></div>
    <p class="err" id="ac-perr" role="status"></p>
  </div>
  <div class="card panel" id="recovery-sec" hidden>
    <h3>Recovery code</h3>
    <p class="note" style="margin:0">If you forget your password, the recovery code lets you set a new one on this device. Making a new code cancels the old one.</p>
    <label>Your password<input id="rc-pw" type="password" autocomplete="current-password"></label>
    <div class="btnrow"><button class="btn" id="rc-new" type="button">Make a new recovery code</button></div>
    <div id="rc-box" hidden><div class="code-box" id="rc-code"></div></div>
    <p class="err" id="rc-err" role="status"></p>
  </div>
  <div class="card panel">
    <h3>Sign out or delete</h3>
    <p class="note" style="margin:0 0 10px">Deleting removes this account and every entry in it. Backup files you saved elsewhere stay where they are.</p>
    <div class="btnrow"><button class="btn" id="ac-out" type="button">Sign out</button><button class="btn danger" id="ac-del" type="button">Delete this account</button></div>
    <p class="err" id="ac-derr" role="alert"></p>
  </div>
</main>
<script src="config/app.config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/crypto.js"></script>
<script src="js/core/supabase.js"></script>
<script src="js/data/local-db.js"></script>
<script src="js/data/cloud-db.js"></script>
<script src="js/data/db.js"></script>
<script src="js/auth/local-auth.js"></script>
<script src="js/auth/cloud-auth.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/app/categories.js"></script>
<script src="js/app/state.js"></script>
<script src="js/app/calc.js"></script>
<script src="js/app/templates.js"></script>
<script src="js/app/layout.js"></script>
<script src="js/app/entry-form.js"></script>
<script src="js/app/detail.js"></script>
<script src="js/app/backup.js"></script>
<script src="js/app/boot.js"></script>
<script src="js/core/pwa.js"></script>
<script src="js/pages/account.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · MoneyShi</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D7852">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body" data-page="forgot-password">
<div class="auth"><div class="auth-card">
<div id="brand"></div>
<h1 class="auth-h">Forgot your password?</h1>
<form id="cloud-form" hidden novalidate>
  <p class="auth-note" style="margin-top:8px">Enter your email address and we will send you a link to choose a new password.</p>
  <label>Email<input id="f-email" type="email" autocomplete="email" autocapitalize="none"></label>
  <p class="err" id="f-err" role="alert"></p>
  <button class="primary wide" type="submit">Send reset link</button>
</form>
<form id="local-form" hidden novalidate>
  <p class="auth-note" style="margin-top:8px">Enter your username, the recovery code you saved when you created the account, and a new password.</p>
  <label>Username<input id="p-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
  <label>Recovery code<input id="p-code" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false"></label>
  <label>New password<div class="pw"><input id="p-pw" type="password" autocomplete="new-password"><button type="button" class="pw-t" data-pw="p-pw">Show</button></div></label>
  <label>Repeat new password<div class="pw"><input id="p-pw2" type="password" autocomplete="new-password"></div></label>
  <p class="err" id="p-err" role="alert"></p>
  <button class="primary wide" type="submit">Set new password</button>
</form>
<div id="done" class="auth-ok" hidden></div>
<p class="auth-links"><a href="login.html">Back to sign in</a></p>
</div></div>
<script src="config/app.config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/crypto.js"></script>
<script src="js/core/supabase.js"></script>
<script src="js/data/local-db.js"></script>
<script src="js/auth/local-auth.js"></script>
<script src="js/auth/cloud-auth.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/app/categories.js"></script>
<script src="js/core/pwa.js"></script>
<script src="js/pages/auth-common.js"></script>
<script src="js/pages/forgot-password.js"></script>
</body>
</html>

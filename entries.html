<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entries · MoneyShi</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D7852">

<body data-page="entries">
<main class="wrap">
<div class="sec-h"><h2>All entries</h2><p>Tap an entry for its details. Edit it there.</p></div>
    <div class="card">
      <div class="filters">
        <input id="q" type="search" placeholder="Search a name, note or category" aria-label="Search entries">
        <select id="fdir" aria-label="Direction"><option value="">In and out</option><option value="out">Money out</option><option value="in">Money in</option></select>
        <select id="fcat" aria-label="Category"></select>
      </div>
      <div class="active-f" id="af"></div>
      <div class="note" id="count" style="margin:0 0 4px"></div>
      <div id="list"></div>
      <button class="btn more" id="more" hidden>Show 50 more</button>
    </div>
</main>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a new password · MoneyShi</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D7852">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body" data-page="reset-password">
<div class="auth"><div class="auth-card">
<div id="brand"></div>
<h1 class="auth-h">Choose a new password</h1>
<form id="reset-form" hidden novalidate>
  <label>New password<div class="pw"><input id="n-pw" type="password" autocomplete="new-password"><button type="button" class="pw-t" data-pw="n-pw">Show</button></div></label>
  <label>Repeat new password<div class="pw"><input id="n-pw2" type="password" autocomplete="new-password"></div></label>
  <p class="err" id="n-err" role="alert"></p>
  <button class="primary wide" type="submit">Save new password</button>
</form>
<div id="reset-msg" class="auth-ok" hidden></div>
<p class="auth-links"><a href="login.html">Back to sign in</a></p>
</div></div>
<script src="config/app.config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/crypto.js"></script>
<script src="js/core/supabase.js"></script>
<script src="js/data/local-db.js"></script>
<script src="js/auth/local-auth.js"></script>
<script src="js/auth/cloud-auth.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/app/categories.js"></script>
<script src="js/core/pwa.js"></script>
<script src="js/pages/auth-common.js"></script>
<script src="js/pages/reset-password.js"></script>
</body>
</html>
